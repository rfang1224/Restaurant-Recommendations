<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Restaurant Recommender</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body class="page">
        <div class="sign-in">
            <form class="login-form">
                <p class="box-title">Log in to start</p>

                <label for="username">Username:</label>
                <input type="text" class="box-input" id="username" placeholder="Username">

                <label for="password">Password:</label>
                <input type="text" class="box-input" id="password" placeholder="Password">

                <button type="submit" class="box-button">Log in</button>

                <button type="button" class="box-button" onclick="window.location.href='signup.html'">Don't have an account? Sign up</button>
            </form>
        </div>
    </body>
</html>
